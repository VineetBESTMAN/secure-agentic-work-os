global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: secure-agentic-work-os
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["backend:8000"]
