name: Deploy production

on:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAMESPACE: ghcr.io/vineetbestman/secure-agentic-work-os

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: backend
            context: backend
            dockerfile: backend/Dockerfile
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile.production
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}-${{ matrix.component }}:${{ github.sha }}
            ${{ env.IMAGE_NAMESPACE }}-${{ matrix.component }}:production

  deploy:
    needs: publish
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_SSH_USER }}
      DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
      SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
      PRODUCTION_APP_URL: ${{ vars.PRODUCTION_APP_URL }}
    steps:
      - name: Configure verified SSH host
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0644 ~/.ssh/known_hosts
      - name: Deploy immutable images
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$DEPLOY_PATH" "${{ github.sha }}" <<'REMOTE'
          set -euo pipefail
          deploy_path="$1"
          image_tag="$2"
          case "$deploy_path" in
            /*) ;;
            *) echo "Production deploy path must be absolute." >&2; exit 2 ;;
          esac
          cd "$deploy_path"
          export APP_IMAGE_TAG="$image_tag"
          docker compose --env-file .env.production -f docker-compose.production.yml pull backend worker frontend caddy clamav prometheus alertmanager
          docker compose --env-file .env.production -f docker-compose.production.yml build backup restore-verify
          docker compose --env-file .env.production -f docker-compose.production.yml up -d --wait --no-build
          REMOTE
      - name: Verify public readiness
        run: |
          test -n "$PRODUCTION_APP_URL"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 10 "$PRODUCTION_APP_URL/ready"; then
              exit 0
            fi
            sleep 15
          done
          exit 1
