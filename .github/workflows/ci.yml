name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          python -m pip install -e ".[dev]"
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest
      - name: Audit backend dependencies
        working-directory: backend
        run: python -m pip_audit
      - name: Verify migration round trip
        working-directory: backend
        env:
          APP_DATABASE_PATH: data/migration-ci.db
        run: |
          mkdir -p data
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic current --check-heads

  postgres-retrieval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: workos_test
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: workos_test_retrieval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workos_test -d workos_test_retrieval"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Verify real PostgreSQL retrieval and tenant boundaries
        working-directory: backend
        env:
          WORKOS_TEST_POSTGRES_URL: postgresql://workos_test:disposable-test-password@localhost:5432/workos_test_retrieval
        run: python -m pytest -q tests/test_postgres_retrieval.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Audit frontend
        working-directory: frontend
        run: npm audit --audit-level=moderate

  production-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate production Compose, proxy, metrics, and alerts
        run: bash scripts/verify_production_config.sh
      - name: Build production application images
        env:
          APP_DOMAIN: workos.example.com
          ACME_EMAIL: operations@example.com
          APP_ACTIVE_ENCRYPTION_KEY_ID: primary
          APP_OBJECT_STORAGE_BUCKET: workos-production
        run: |
          docker build -t workos-backend-ci backend
          docker build -f frontend/Dockerfile.production -t workos-frontend-ci frontend
          docker run --rm --entrypoint sh workos-frontend-ci -c "nginx -t && ! grep -R 'http://127.0.0.1:8000' /usr/share/nginx/html"
          docker build -t workos-backup-ci ops/backup
          docker run --rm --entrypoint bash workos-backup-ci -n /opt/workos/backup.sh
          docker run --rm --entrypoint bash workos-backup-ci -n /opt/workos/restore-verify.sh
          docker run --rm --entrypoint bash workos-backup-ci -n /opt/workos/entrypoint.sh
